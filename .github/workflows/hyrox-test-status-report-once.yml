name: HYROX Test Status Report Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hyrox-test-status-report-once.yml"
  schedule:
    - cron: "27 6 22 8 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FORCE_STATUS_REPORT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest repository state
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send HYROX test status report
        run: python hyrox-ticket-agent/check_hyrox.py

      - name: Remove one-time workflow and commit state
        run: |
          rm -f .github/workflows/hyrox-test-status-report-once.yml
          if [[ -n "$(git status --porcelain hyrox-ticket-agent/state/status.json .github/workflows/hyrox-test-status-report-once.yml)" ]]; then
            git config user.name "hyrox-ticket-agent"
            git config user.email "hyrox-ticket-agent@users.noreply.github.com"
            git add hyrox-ticket-agent/state/status.json .github/workflows/hyrox-test-status-report-once.yml
            git commit -m "Remove HYROX test status workflow"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No state changes."
          fi

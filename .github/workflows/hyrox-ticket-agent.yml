name: HYROX Ticket Watcher

on:
  schedule:
    - cron: "0 8,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HYROX_EVENT_URL: "https://hyroxsa.com/event/hyrox-seoul/"
      HYROX_TICKET_URL: "https://korea.hyrox.com/event/hyrox-seoul-season-26-27-vthaza?useEmbed=true"
      TARGET_CATEGORY: "HYROX DOUBLES MIXED|Doubles Mixed|Open Mixed"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest repository state
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check HYROX Seoul tickets
        run: python hyrox-ticket-agent/check_hyrox.py

      - name: Commit state if changed
        run: |
          if [[ -n "$(git status --porcelain hyrox-ticket-agent/state/status.json)" ]]; then
            git config user.name "hyrox-ticket-agent"
            git config user.email "hyrox-ticket-agent@users.noreply.github.com"
            git add hyrox-ticket-agent/state/status.json
            git commit -m "Update HYROX Seoul ticket status"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No state changes."
          fi

name: HYROX Ticket Watcher

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hyrox-ticket-agent.yml"
      - "hyrox-ticket-agent/check_hyrox.py"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: hyrox-singapore-kuala-lumpur-ticket-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest repository state
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check HYROX tickets
        run: python hyrox-ticket-agent/check_hyrox.py

      - name: Commit state if changed
        run: |
          if [[ -n "$(git status --porcelain hyrox-ticket-agent/state/status.json)" ]]; then
            git config user.name "hyrox-ticket-agent"
            git config user.email "hyrox-ticket-agent@users.noreply.github.com"
            git add hyrox-ticket-agent/state/status.json
            git commit -m "Update HYROX ticket status"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No state changes."
          fi

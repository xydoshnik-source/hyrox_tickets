name: HYROX Ticket Watcher

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hyrox-ticket-agent.yml"
      - "hyrox-ticket-agent/check_hyrox.py"
  schedule:
    - cron: "0 22,10 * * *"
    - cron: "24 0,12 * * *"
    - cron: "48 2,14 * * *"
    - cron: "12 5,17 * * *"
    - cron: "36 7 * * *"
    - cron: "36 19 * * *"
  workflow_dispatch:
    inputs:
      send_receipt:
        description: "Send a test receipt to Telegram"
        required: true
        type: boolean
        default: true

concurrency:
  group: hyrox-seoul-ticket-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEND_DAILY_RECEIPT: ${{ github.event_name == 'schedule' && github.event.schedule == '36 7 * * *' }}
      FORCE_DAILY_RECEIPT: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.send_receipt) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest repository state
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check HYROX tickets
        run: python hyrox-ticket-agent/check_hyrox.py

      - name: Commit state if changed
        run: |
          if [[ -n "$(git status --porcelain hyrox-ticket-agent/state/status.json)" ]]; then
            git config user.name "hyrox-ticket-agent"
            git config user.email "hyrox-ticket-agent@users.noreply.github.com"
            git add hyrox-ticket-agent/state/status.json
            git commit -m "Update HYROX ticket status"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No state changes."
          fi
